name: build

# Se ejecuta en cada push/PR a main, y también se puede lanzar a mano desde
# la pestaña "Actions" de GitHub (workflow_dispatch).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Compila en las tres plataformas para detectar cualquier problema
    # específico de Linux/macOS/Windows lo antes posible.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias (NuGet)
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore
