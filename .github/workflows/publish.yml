name: publish

# Genera ejecutables autocontenidos (no requieren tener .NET instalado) para
# Linux, Windows y macOS. Se dispara a mano desde "Actions", o al crear un
# tag de versión (v1.0.0, v1.1.0, etc.), en cuyo caso además adjunta los
# archivos a un Release de GitHub.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar ejecutable autocontenido (${{ matrix.rid }})
        run: >
          dotnet publish LabInventario.Avalonia.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:UseAppHost=true
          -o publicado/${{ matrix.rid }}

      - name: Subir como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: LabInventario-${{ matrix.rid }}
          path: publicado/${{ matrix.rid }}

      - name: Crear/adjuntar al Release con título y notas (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publicado/${{ matrix.rid }}/**
          tag_name: ${{ github.ref_name }}
          name: "LabInventario ${{ github.ref_name }}"
          body: |
            LabInventario — Gestión de salidas y entradas del Laboratorio de Electrónica.

            Primera versión estable del sistema, con los principales módulos:

            - Inventario de materiales y catálogo de alumnos.
            - Salidas y devoluciones de préstamos (FIFO).
            - Escaneo de códigos de barras.
            - Cables complementarios auto-detectados (fuente, generador, osciloscopio).
            - Importación y exportación CSV / XLSX.
            - Respaldo cifrado de la base de datos (SQLCipher).

            Ejecutables autocontenidos (un solo archivo) para cada plataforma;
            no requieren tener .NET instalado.

            - **LabInventario-linux-x64**: Linux 64 bits
            - **LabInventario-win-x64**: Windows 64 bits
            - **LabInventario-osx-x64**: macOS 64 bits
