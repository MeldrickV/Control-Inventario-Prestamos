name: publish

# Genera ejecutables autocontenidos (no requieren tener .NET instalado) para
# Linux, Windows y macOS y los empaqueta en un .zip por plataforma. Se dispara
# a mano desde "Actions", o al crear un tag de versión (v1.0.0, v1.1.0, etc.),
# en cuyo caso además sube los .zip a un Release de GitHub. Si el Release de
# ese tag ya existía (p. ej. se relanzó el tag), primero lo elimina para
# regenerarlo limpio, sin assets sobrantes de corridas anteriores.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publicar:
    name: Empaquetar (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar ejecutable autocontenido (${{ matrix.rid }})
        run: >
          dotnet publish LabInventario.Avalonia.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:UseAppHost=true
          -o publicado/${{ matrix.rid }}

      - name: Empaquetar en .zip (ejecutable + librerías nativas)
        shell: pwsh
        run: Compress-Archive -Path "publicado/${{ matrix.rid }}/*" -DestinationPath "publicado/LabInventario-${{ matrix.rid }}.zip" -Force

      - name: Subir paquete comprimido como artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabInventario-${{ matrix.rid }}
          path: publicado/LabInventario-${{ matrix.rid }}.zip

  release:
    name: Crear/regenerar Release (solo tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publicar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar los paquetes comprimidos
        uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - name: Eliminar el Release previo de este tag (para regenerarlo limpio)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: releases } = await github.rest.repos.listReleases({ owner, repo });
              for (const r of releases) {
                if (r.tag_name === tag) {
                  await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
                  core.info(`Release ${r.id} (${tag}) eliminado`);
                }
              }
            } catch (error) {
              core.info(`Sin release previo para ${tag}: ${error.message}`);
            }

      - name: Crear Release con los paquetes .zip y notas
        uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*.zip
          tag_name: ${{ github.ref_name }}
          name: "LabInventario ${{ github.ref_name }}"
          body: |
            LabInventario — Gestión de salidas y entradas del Laboratorio de Electrónica.

            Primera versión estable del sistema, con los principales módulos:

            - Inventario de materiales y catálogo de alumnos.
            - Salidas y devoluciones de préstamos (FIFO).
            - Escaneo de códigos de barras.
            - Cables complementarios auto-detectados (fuente, generador, osciloscopio).
            - Importación y exportación CSV / XLSX.
            - Respaldo cifrado de la base de datos (SQLCipher).

            Los archivos adjuntos son paquetes comprimidos (un .zip por
            plataforma) con el ejecutable autocontenido y sus librerías
            nativas; no requieren tener .NET instalado.

            - **LabInventario-linux-x64.zip**: Linux 64 bits
            - **LabInventario-win-x64.zip**: Windows 64 bits
            - **LabInventario-osx-x64.zip**: macOS 64 bits